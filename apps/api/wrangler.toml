# 手元（wrangler dev）と本番の設定。環境ごとの分け方は specs/015-deploy-environments/contracts/environments.md。
#
# ⚠️ wrangler の名前付きの環境（[env.staging]・[env.production]）は、この一番上の設定を**受け継がない**。
# vars・kv_namespaces・triggers は、どちらの環境にも書き切ること（書き忘れは test/unit/wrangler-config.test.ts で止まる）。
# ⚠️ 一番上の設定は**手元（wrangler dev）とテストのためだけ**。名前も本番と分けてあるので、
# `--env` を付けない `wrangler deploy` が本番を上書きすることはない。デプロイは必ず
# `--env staging` か `--env production` を付ける（ふだんは .github/workflows/deploy.yml から）。
name = "threads-grower-api-dev"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# 定期処理（contracts/api.md「定期処理」）
# - 0 18 * * *：日次の処理（03:00 JST）
# - */5 * * * *：自動投稿（specs/005-auto-post contracts/auto-post-job.md）。KVの関所で、用のない回はDBに触れない
[triggers]
crons = ["0 18 * * *", "*/5 * * * *"]

# 自動投稿の関所（specs/005-auto-post research.md R3）。
# 本番では `wrangler kv namespace create AUTOPOST_KV` で作り、表示された id をここに入れる（docs/external-services-setup.md）。
# ローカル（wrangler dev）とテストは、メモリ上のKVを使うので、この id のままでよい。
[[kv_namespaces]]
binding = "AUTOPOST_KV"
id = "00000000000000000000000000000000"

# 集金管理の会場の共有（specs/collect/001-event-day-collection research.md R4・contracts/realtime.md 5）。
# イベントごとの Durable Object が、つないでいる画面に知らせを配るだけ（何も保存しない）。名前付きの環境は受け継がないので、
# 3か所（ここ・staging・production）に書く（書き忘れは test/unit/wrangler-config.test.ts で止まる）。
# 入場券の署名の秘密は `wrangler secret put COLLECT_LIVE_SECRET --env …`（.dev.vars.example 参照）
[[durable_objects.bindings]]
name = "COLLECT_LIVE"
class_name = "CollectLiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CollectLiveRoom"]

# 秘密でない設定。秘密情報は `wrangler secret put` / .dev.vars で設定する（.dev.vars.example 参照）
[vars]
THREADS_AUTH_BASE_URL = "https://threads.com"
THREADS_GRAPH_BASE_URL = "https://graph.threads.com"
TOKEN_ENCRYPTION_KEY_VERSION = "1"

# ──────────────────────────────────────────────────────────────────────────
# ステージング（develop ブランチ）
# 秘密情報は `wrangler secret put <名前> --env staging`（data-model.md 3-1 の「秘」）。
# ──────────────────────────────────────────────────────────────────────────
[env.staging]
name = "threads-grower-api-staging"

[env.staging.triggers]
crons = ["0 18 * * *", "*/5 * * * *"]

[[env.staging.kv_namespaces]]
binding = "AUTOPOST_KV"
id = "8721878c58494198ae62714a771f8829"

[[env.staging.durable_objects.bindings]]
name = "COLLECT_LIVE"
class_name = "CollectLiveRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["CollectLiveRoom"]

[env.staging.vars]
APP_ENV = "staging"
# ↓ Clerkの開発用インスタンス（手元の開発と同じ。9-7）
CLERK_PUBLISHABLE_KEY = "pk_test_cGF0aWVudC1seW54LTg5NzIuY2xlcmsuYWNjb3VudHMuZGV2JA"
# ↓ テスト版のMetaアプリ「ThreadsAutomation」（specs/024 research.md R12）。シークレット THREADS_APP_SECRET は
#   `wrangler secret put THREADS_APP_SECRET --env staging` で入れる（入れるまでAPIは CONFIG_ERROR で止まる）
THREADS_APP_ID = "1367107908637398"
# ↓ Stripeのテスト環境（サンドボックス）の料金。アカウント1件につき1,000円・毎月・JPY・税込み（10-2。specs/024 で
#   段階制から作り直す。作り直すまでは古い料金のまま請求される）
STRIPE_PRICE_ID = "price_1UWWzr450ulOJK91LcANS5Ae"
# ↓ ステージングのURL（ドメインを買うまではCloudflareの既定のURL。9-0-1）
THREADS_REDIRECT_URI = "https://threads-grower-api-staging.marron-taku.workers.dev/api/threads/callback"
WEB_ORIGIN = "https://develop.threads-grower-web.pages.dev"
# ↓ ここから下は、このままでよい値
THREADS_ACCESS_MODE = "testers"
THREADS_AUTH_BASE_URL = "https://threads.com"
THREADS_GRAPH_BASE_URL = "https://graph.threads.com"
TOKEN_ENCRYPTION_KEY_VERSION = "1"
BILLING_ENABLED = "true"
# テスト用のグループ（specs/016）。テスト版は招待されたグループの人だけが使える。運営者は
# `wrangler secret put OPERATOR_CLERK_USER_IDS --env staging`（ClerkのユーザーIDのカンマ区切り）
TEST_GROUPS_ENABLED = "true"
# 任意（入れなければStripeの既定）：STRIPE_PORTAL_CONFIGURATION_ID・STRIPE_TAX_RATE_ID
# つなぐ方法は両方（THREADS_CONNECT_METHODS は書かない）。審査の前は、テスター招待（申し込み→招待→承認）のあと
# 「Threadsで許可する」でつなぐ。トークンの貼り付けも残す（specs/024 FR-028）

# ──────────────────────────────────────────────────────────────────────────
# 本番（main ブランチ）
# 秘密情報は `wrangler secret put <名前> --env production`。
# ──────────────────────────────────────────────────────────────────────────
[env.production]
name = "threads-grower-api"

[env.production.triggers]
crons = ["0 18 * * *", "*/5 * * * *"]

[[env.production.kv_namespaces]]
binding = "AUTOPOST_KV"
id = "e5fd38abb2a847b9a02588d9f2842d0b"

[[env.production.durable_objects.bindings]]
name = "COLLECT_LIVE"
class_name = "CollectLiveRoom"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["CollectLiveRoom"]

[env.production.vars]
APP_ENV = "production"
# ↓ 見本の値のまま。T027〜T032 で本物に差し替える。差し替えるまでAPIは CONFIG_ERROR で止まる
CLERK_PUBLISHABLE_KEY = "pk_test_xxx"
# ↓ 本番用のMetaアプリ（新しく作る。specs/024 research.md R12）のアプリID。STRIPE_PRICE_ID は1件1,000円の料金
THREADS_APP_ID = "000000000000000"
THREADS_REDIRECT_URI = "https://api.example.com/api/threads/callback"
WEB_ORIGIN = "https://app.example.com"
STRIPE_PRICE_ID = "price_xxx"
# ↓ ここから下は、このままでよい値
