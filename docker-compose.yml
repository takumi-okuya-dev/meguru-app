# ローカル開発・テスト用のDB（research.md R12）
# Postgres 17 と、Neonのサーバーレスドライバーで接続するための local-neon-http-proxy
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: threads_grower
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/threads_grower
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
