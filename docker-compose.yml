# ローカル開発・テスト用のDB（research.md R12）
# Postgres 17 と、Neonのサーバーレスドライバーで接続するための local-neon-http-proxy
# 名前を決めておき、どの作業場所（git worktree）で docker compose を動かしても、同じ1つのDBのコンテナを使う。
# 作業場所ごとのDBは、このPostgresの中に別の名前で作る（pnpm worktree:new。README「手元で同時に進める」）
name: meguru-app
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: threads_grower
    ports:
      - "5432:5432"
    volumes:
      # DBを新しく作ったときだけ実行される（テストを速くする設定。docker/postgres-init/ を参照）
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/threads_grower
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy
