# デプロイ：develop への push でステージング、main への push で本番に出す
# （specs/015-deploy-environments contracts/deploy.md 2）。
# 順番は マイグレーション → API → Web。1つでも失敗したら、そこで止める（FR-012）。
# 途中で止まったときに何が起きるかは、contracts/deploy.md 2 の表を見る。
name: Deploy

on:
  push:
    branches: [develop, main]
  # やり直し用。Actionsの画面から手で動かせる
  workflow_dispatch:

# 同じ環境へのデプロイは1つずつ。走っているものを打ち切らない（FR-013）
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHubのEnvironmentのSecretsと変数を使う（data-model.md 3-2・3-3）
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      # 手で動かすとき（workflow_dispatch）は、どのブランチも選べてしまう。
      # main と develop 以外は、ここで止める（ほかのブランチをステージングに出さないため）
      - name: 環境の名前を決める
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main) echo "wrangler=production" >> "$GITHUB_OUTPUT" ;;
            develop) echo "wrangler=staging" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::デプロイできるのは main（本番）と develop（ステージング）だけです（選ばれたのは ${{ github.ref_name }}）。"
              exit 1
              ;;
          esac

      # 外部サービスの設定（docs/external-services-setup.md「9-11」）の確認。
      # - 1つも入っていない → 何もせずに終わる（移行の間だけの安全弁。9-11が済んだら、このステップと下の if を消してよい）
      # - 一部だけ入っている → 止める（空のClerkの鍵や localhost 向きのWebを本番に出さないため）
      - name: 設定がそろっているか見る
        id: ready
        # 秘密の値は env 経由で渡す（run の文に埋め込まない）。中身は見ず、空かどうかだけを見る
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
        run: |
          required="CLOUDFLARE_API_TOKEN DATABASE_URL CLOUDFLARE_ACCOUNT_ID VITE_API_BASE_URL VITE_CLERK_PUBLISHABLE_KEY VITE_APP_ENV"
          missing=""
          filled=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else filled="$filled $name"; fi
          done
          if [ -z "$filled" ]; then
            echo "::warning::GitHubのEnvironmentの設定がまだなので、デプロイしません。docs/external-services-setup.md の「9. 公開のための準備」を済ませてください。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::GitHubのEnvironmentの設定が足りません（$missing）。docs/external-services-setup.md の「9-11」を見て入れてください。"
            exit 1
          else
            # VITE_APP_ENV が、出す先の環境と合っているか（取り違えると帯が出ない・出たままになる）
            case "${{ steps.env.outputs.wrangler }}:$VITE_APP_ENV" in
              production:production|staging:staging) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::VITE_APP_ENV（$VITE_APP_ENV）が、出す先（${{ steps.env.outputs.wrangler }}）と合っていません。"
                exit 1
                ;;
            esac
          fi

      # Webのビルド。VITE_… はビルドに焼き込まれるので、公開してよい値だけを入れる（data-model.md 3-2）
      - name: Web をビルドする
        if: steps.ready.outputs.ready == 'true'
        run: pnpm --filter web build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}

      # 1. マイグレーション。ここで失敗したら、DBだけが新しくAPIとWebは前の版のまま（research.md R4）
      # drizzle-kit が読むのは DATABASE_URL_DIRECT（apps/api/drizzle.config.ts）。同じ接続文字列を渡す
      - name: マイグレーションを当てる
        if: steps.ready.outputs.ready == 'true'
        run: pnpm --filter api db:migrate
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL }}

      # 2. API（Cloudflare Workers）
      - name: API を出す
        if: steps.ready.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env ${{ steps.env.outputs.wrangler }}

      # 3. Web（Cloudflare Pages）。main は本番、develop はブランチの別名として出る
      - name: Web を出す
        if: steps.ready.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name threads-grower-web --branch ${{ github.ref_name }}
